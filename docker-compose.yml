version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_USER: salik
      MYSQL_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database_setup.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3308:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  book-service:
    image: salikarth/book-service:latest  # Gunakan image dari Docker Hub
    container_name: book_service
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=""
      - MYSQL_PORT=3306
      - MYSQL_DB_BOOK=book_management_uts_db
      - BOOK_SERVICE_PORT=5000
      - URL=http://localhost
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  loan-service:
    image: salikarth/loan-service:latest  # Gunakan image dari Docker Hub
    container_name: loan_service
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=""
      - MYSQL_PORT=3306
      - MYSQL_DB_LOAN=loan_management_uts_db
      - LOAN_SERVICE_PORT=5001
      - URL=http://localhost
    ports:
      - "5001:5001"
    depends_on:
      mysql:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - app-network

  user-service:
    image: salikarth/user-service:latest  # Gunakan image dari Docker Hub
    container_name: user_service
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=""
      - MYSQL_PORT=3306
      - MYSQL_DB_USER=user_management_uts_db
      - USER_SERVICE_PORT=5002
      - URL=http://localhost
    ports:
      - "5002:5002"
    depends_on:
      mysql:
        condition: service_healthy
      loan-service:
        condition: service_started
    networks:
      - app-network

  predict-service:
    image: salikarth/predict-service:latest  # Gunakan image dari Docker Hub
    container_name: predict_service
    environment:
      - MYSQL_HOST=mysql_db
      - MYSQL_USER=root
      - MYSQL_PASSWORD=""
      - MYSQL_PORT=3306
      - PREDICT_SERVICE_PORT=5003
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - URL=http://localhost
    ports:
      - "5003:5003"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    image: salikarth/frontend:latest  # Gunakan image dari Docker Hub
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - book-service
      - loan-service
      - user-service
      - predict-service
    networks:
      - app-network

volumes:
  mysql_data:

networks:
  app-network:
    driver: bridge